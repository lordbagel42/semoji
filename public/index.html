<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="Find Hack Club Slack emoji by keyword or meaning.">
    <title>semoji</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>semoji</h1>
        <a href="https://emojis.raygen.dev/docs">API docs</a>
      </header>
      <search>
        <form id="search-form">
          <label for="search-input">Find a Hack Club emoji</label>
          <div class="search-row">
            <input id="search-input" name="q" type="search" maxlength="300"
              placeholder="A name, a feeling, a very specific cat…" required>
            <button id="search-button" type="submit">Search</button>
          </div>
          <fieldset class="search-mode">
            <legend class="sr-only">Search mode</legend>
            <label><input type="radio" name="mode" value="keyword" checked><span>Keyword</span></label>
            <label><input type="radio" name="mode" value="semantic"><span>Semantic</span></label>
          </fieldset>
        </form>
      </search>
      <p id="search-message" role="status">Search names and descriptions. Up to 10 results.</p>
      <ol id="search-results" aria-label="Search results"></ol>
      <noscript>Enable JavaScript to search, or use the <a href="https://emojis.raygen.dev/docs">public API</a>.</noscript>
    </main>
  </body>
</html>
